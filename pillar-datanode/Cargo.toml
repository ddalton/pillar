[package]
name = "pillar-datanode"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "pillar-datanode"
path = "src/main.rs"

[dependencies]
pillar-proto = { path = "../pillar-proto" }
pillar-common = { path = "../pillar-common" }

tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
# Data transfer SASL (credentials, AES keys)
base64 = "0.22"
rand = "0.8"
bytes = { workspace = true }
dashmap = { workspace = true }
async-trait = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

clap = { workspace = true }
uuid = { workspace = true }
nix = { workspace = true }
hostname = "0.4"
crc32c = "0.6.8"     # CRC32C (Castagnoli), hardware-accelerated: HDFS default checksum
crc32fast = "1.5"    # CRC32 (zlib): the other HDFS checksum type

# Optional RDMA support
ibverbs = { workspace = true, optional = true }

[features]
default = []
rdma = ["dep:ibverbs"]

[dev-dependencies]
tempfile = "3.8"
pillar-namenode = { path = "../pillar-namenode" }
# Independent HDFS client (Hadoop IPC + DataTransferProtocol) for interop tests.
hdfs-native = { version = "=0.14.6", default-features = false }

[build-dependencies]
tonic-build = "0.12"
