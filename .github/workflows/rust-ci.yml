# Unit and integration tests, including the end-to-end suites that run a
# NameNode, DataNodes and the hdfs-native client in process, and the stock
# Apache Hadoop Java client against the built binaries.
name: rust-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: install protoc (tonic-build)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Hadoop Java client interop (tests/interop/run-java-interop.sh)
        run: tests/interop/run-java-interop.sh
      - name: Hadoop Java client interop with block access tokens
        run: BLOCK_TOKENS=1 tests/interop/run-java-interop.sh
      - name: Hadoop Java client interop with encrypted data transfer (AES/CTR)
        run: ENCRYPT=aes tests/interop/run-java-interop.sh
      - name: Hadoop Java client interop with encrypted data transfer (SASL RC4)
        run: ENCRYPT=rc4 tests/interop/run-java-interop.sh
      - name: install MIT krb5 (a throwaway KDC for the Kerberos interop)
        run: sudo apt-get install -y krb5-kdc krb5-admin-server
      - name: Hadoop Java client with Kerberos (tests/interop/run-java-kerberos.sh)
        run: tests/interop/run-java-kerberos.sh
      - name: Hadoop Java client with Kerberos and RPC privacy
        run: RPC_PROTECTION=privacy tests/interop/run-java-kerberos.sh
      - name: Hadoop Java client with Kerberos and data transfer protection (privacy, integrity)
        run: |
          DATA_PROTECTION=privacy tests/interop/run-java-kerberos.sh
          DATA_PROTECTION=integrity tests/interop/run-java-kerberos.sh
