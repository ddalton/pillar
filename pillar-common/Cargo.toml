[package]
name = "pillar-common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }

# Hadoop IPC (shared by the NameNode and DataNode RPC servers)
pillar-proto = { path = "../pillar-proto" }
prost = { workspace = true }
async-trait = { workspace = true }
# Kerberos (SASL GSSAPI) for Hadoop IPC, and per-call for gRPC
krb5 = "0.12.1"
tonic = { workspace = true }
tower = { workspace = true }
http = "1"
http-body = "1"
http-body-util = "0.1"
tokio-stream = { workspace = true }
# Block access tokens (HMAC-SHA1) and their SASL DIGEST-MD5 use
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
rand = "0.8"
base64 = "0.22"
# Data transfer encryption (AES/CTR/NoPadding)
aes = "0.9"
ctr = "0.10"

# Checksums
sha2 = { workspace = true }

# System calls
nix = { workspace = true }

