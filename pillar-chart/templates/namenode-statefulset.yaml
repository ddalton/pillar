apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pillar.fullname" . }}-namenode
  labels:
    app: {{ include "pillar.name" . }}-namenode
    component: namenode
    {{- include "pillar.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "pillar.fullname" . }}-namenode
  replicas: {{ .Values.namenode.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: {{ include "pillar.name" . }}-namenode
      component: namenode
  template:
    metadata:
      labels:
        app: {{ include "pillar.name" . }}-namenode
        component: namenode
    spec:
      containers:
      - name: namenode
        image: "{{ .Values.namenode.image.repository }}:{{ .Values.namenode.image.tag }}"
        imagePullPolicy: {{ .Values.namenode.image.pullPolicy }}
        env:
        # Pod information
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # NameNode HA configuration
        # The first pod (index 0) will be the active NameNode
        # All other pods will be standby NameNodes
        - name: NAMENODE_HA_ENABLED
          value: "{{ gt (int .Values.namenode.replicas) 1 }}"
        - name: NAMENODE_SERVICE_NAME
          value: "{{ include "pillar.fullname" . }}-namenode"
        # Etcd endpoints for HA metadata storage
        - name: ETCD_ENDPOINTS
          value: {{ include "pillar.etcdEndpoints" . | quote }}
        {{- if .Values.security.kerberos.enabled }}
        - name: KRB5_CONFIG
          value: /etc/security/keytabs/krb5.conf
        {{- end }}
        envFrom:
        - configMapRef:
            name: {{ include "pillar.fullname" . }}-common-config
        - configMapRef:
            name: {{ include "pillar.fullname" . }}-namenode-config
        args:
        - --rpc-addr=0.0.0.0:{{ .Values.namenode.rpcPort }}
        - --http-addr=0.0.0.0:{{ .Values.namenode.httpPort }}
        - --etcd-endpoints={{ include "pillar.etcdEndpoints" . }}
        - --replication={{ .Values.hdfs.replication }}
        - --block-size-mb={{ .Values.hdfs.blockSize }}
        - --name-dir=/var/lib/pillar/name
        {{- if gt (int .Values.namenode.replicas) 1 }}
        - --ha-enabled=true
        {{- end }}
        {{- include "pillar.securityArgs" . | nindent 8 }}
        {{- if .Values.security.kerberos.enabled }}
        - --kerberos-keytab=/etc/security/keytabs/krb5.keytab
        - --kerberos-principal={{ include "pillar.namenodePrincipal" . }}
        - --datanode-principal=dn/_HOST@{{ include "pillar.realm" . }}
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/pillar/name
        {{- if .Values.security.kerberos.enabled }}
        - name: keytabs
          mountPath: /etc/security/keytabs
          readOnly: true
        {{- end }}
        ports:
        - name: rpc
          containerPort: {{ .Values.namenode.rpcPort }}
          protocol: TCP
        - name: http
          containerPort: {{ .Values.namenode.httpPort }}
          protocol: TCP
        resources:
          {{- toYaml .Values.namenode.resources | nindent 10 }}
        livenessProbe:
          tcpSocket:
            port: rpc
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: rpc
          initialDelaySeconds: 10
          periodSeconds: 5
      {{- if or (not .Values.namenode.persistence.enabled) .Values.security.kerberos.enabled }}
      volumes:
      {{- end }}
      {{- if not .Values.namenode.persistence.enabled }}
      - name: data
        emptyDir: {}
      {{- end }}
      {{- if .Values.security.kerberos.enabled }}
      - name: keytabs
        secret:
          secretName: {{ include "pillar.namenodeKeytabSecret" . }}
      {{- end }}
  {{- if .Values.namenode.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.namenode.persistence.storageClass }}
      storageClassName: {{ .Values.namenode.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.namenode.persistence.size }}
  {{- end }}
