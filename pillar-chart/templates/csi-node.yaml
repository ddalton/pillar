{{- if .Values.csiDriver.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "pillar.fullname" . }}-csi-node
  labels:
    app: {{ include "pillar.name" . }}-csi-node
    {{- include "pillar.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ include "pillar.name" . }}-csi-node
  template:
    metadata:
      labels:
        app: {{ include "pillar.name" . }}-csi-node
    spec:
      serviceAccountName: {{ include "pillar.fullname" . }}-csi-node
      hostNetwork: true
      containers:
      - name: csi-node-driver-registrar
        image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.9.0
        args:
        - --csi-address=/csi/csi.sock
        - --kubelet-registration-path={{ .Values.csiDriver.socketDir }}/csi.sock
        volumeMounts:
        - name: socket-dir
          mountPath: /csi
        - name: registration-dir
          mountPath: /registration
      - name: pillar-csi-driver
        image: "{{ .Values.csiDriver.image.repository }}:{{ .Values.csiDriver.image.tag }}"
        imagePullPolicy: {{ .Values.csiDriver.image.pullPolicy }}
        args:
        - --mode=node
        - --socket={{ .Values.csiDriver.socketDir }}/csi.sock
        - --namenode={{ include "pillar.fullname" . }}-namenode:{{ .Values.namenode.rpcPort }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true
        volumeMounts:
        - name: socket-dir
          mountPath: {{ .Values.csiDriver.socketDir }}
        - name: pods-mount-dir
          mountPath: /var/lib/kubelet/pods
          mountPropagation: Bidirectional
        resources:
          {{- toYaml .Values.csiDriver.node.resources | nindent 10 }}
      volumes:
      - name: socket-dir
        hostPath:
          path: {{ .Values.csiDriver.socketDir }}
          type: DirectoryOrCreate
      - name: registration-dir
        hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: Directory
      - name: pods-mount-dir
        hostPath:
          path: /var/lib/kubelet/pods
          type: Directory
{{- end }}
