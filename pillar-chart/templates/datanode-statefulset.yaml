apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pillar.fullname" . }}-datanode
  labels:
    app: {{ include "pillar.name" . }}-datanode
    component: datanode
    {{- include "pillar.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "pillar.fullname" . }}-datanode
  replicas: {{ .Values.datanode.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: {{ include "pillar.name" . }}-datanode
      component: datanode
  template:
    metadata:
      labels:
        app: {{ include "pillar.name" . }}-datanode
        component: datanode
    spec:
      containers:
      - name: datanode
        image: "{{ .Values.datanode.image.repository }}:{{ .Values.datanode.image.tag }}"
        imagePullPolicy: {{ .Values.datanode.image.pullPolicy }}
        env:
        # Pod information
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        envFrom:
        # Inject common HDFS configuration
        - configMapRef:
            name: {{ include "pillar.fullname" . }}-common-config
        # Inject DataNode-specific configuration
        - configMapRef:
            name: {{ include "pillar.fullname" . }}-datanode-config
        args:
        - --namenode={{ include "pillar.fullname" . }}-namenode:{{ .Values.namenode.rpcPort }}
        - --rpc-addr=0.0.0.0:{{ .Values.datanode.rpcPort }}
        - --data-addr=0.0.0.0:{{ .Values.datanode.dataPort }}
        - --http-addr=0.0.0.0:{{ .Values.datanode.httpPort }}
        - --volume-mount-point=/mnt/pillar-data
        - --block-pool-id={{ .Values.hdfs.blockPoolId }}
        {{- if .Values.datanode.rdma.enabled }}
        - --transport=auto
        - --rdma-port={{ .Values.datanode.rdma.port }}
        {{- end }}
        ports:
        - name: rpc
          containerPort: {{ .Values.datanode.rpcPort }}
          protocol: TCP
        - name: data
          containerPort: {{ .Values.datanode.dataPort }}
          protocol: TCP
        - name: http
          containerPort: {{ .Values.datanode.httpPort }}
          protocol: TCP
        {{- if .Values.datanode.rdma.enabled }}
        - name: rdma
          containerPort: {{ .Values.datanode.rdma.port }}
          protocol: TCP
        {{- end }}
        volumeMounts:
        - name: storage
          mountPath: /mnt/pillar-data
        resources:
          {{- toYaml .Values.datanode.resources | nindent 10 }}
        livenessProbe:
          tcpSocket:
            port: rpc
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: rpc
          initialDelaySeconds: 10
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.datanode.storage.storageClass }}
      storageClassName: {{ .Values.datanode.storage.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.datanode.storage.size }}
