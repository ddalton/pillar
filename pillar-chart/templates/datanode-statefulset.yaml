apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pillar.fullname" . }}-datanode
  labels:
    app: {{ include "pillar.name" . }}-datanode
    component: datanode
    {{- include "pillar.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "pillar.fullname" . }}-datanode
  replicas: {{ .Values.datanode.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: {{ include "pillar.name" . }}-datanode
      component: datanode
  template:
    metadata:
      labels:
        app: {{ include "pillar.name" . }}-datanode
        component: datanode
    spec:
      containers:
      - name: datanode
        image: "{{ .Values.datanode.image.repository }}:{{ .Values.datanode.image.tag }}"
        imagePullPolicy: {{ .Values.datanode.image.pullPolicy }}
        env:
        # Pod information
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        {{- if .Values.security.kerberos.enabled }}
        - name: KRB5_CONFIG
          value: /etc/security/keytabs/krb5.conf
        {{- end }}
        envFrom:
        # Inject common HDFS configuration
        - configMapRef:
            name: {{ include "pillar.fullname" . }}-common-config
        # Inject DataNode-specific configuration
        - configMapRef:
            name: {{ include "pillar.fullname" . }}-datanode-config
        args:
        - --namenode={{ include "pillar.fullname" . }}-namenode:{{ .Values.namenode.rpcPort }}
        # Clients connect to the address a DataNode registers, so it must be
        # routable from other pods: the pod IP. The UUID must survive
        # restarts: the pod name.
        - --hostname=$(POD_IP)
        - --uuid=$(POD_NAME)
        - --rpc-addr=0.0.0.0:{{ .Values.datanode.rpcPort }}
        - --data-addr=0.0.0.0:{{ .Values.datanode.dataPort }}
        - --http-addr=0.0.0.0:{{ .Values.datanode.httpPort }}
        - --volume-mount-point=/mnt/pillar-data
        - --block-pool-id={{ .Values.hdfs.blockPoolId }}
        {{- if .Values.datanode.rdma.enabled }}
        - --transport=auto
        - --rdma-port={{ .Values.datanode.rdma.port }}
        {{- end }}
        {{- include "pillar.securityArgs" . | nindent 8 }}
        {{- with .Values.security.dataTransferProtection }}
        - --data-transfer-protection={{ . }}
        {{- end }}
        {{- if .Values.security.kerberos.enabled }}
        # Each pod's own keytab (<pod>.keytab), read from the Secret's
        # directory so the key of a pod added by a scale-up reaches it.
        - --kerberos-keytab=/etc/security/keytabs/$(POD_NAME).keytab
        - --kerberos-principal=dn/$(POD_NAME).{{ include "pillar.fullname" . }}-datanode.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}@{{ include "pillar.realm" . }}
        - --namenode-principal={{ include "pillar.namenodePrincipal" . }}
        {{- end }}
        ports:
        - name: rpc
          containerPort: {{ .Values.datanode.rpcPort }}
          protocol: TCP
        - name: data
          containerPort: {{ .Values.datanode.dataPort }}
          protocol: TCP
        - name: http
          containerPort: {{ .Values.datanode.httpPort }}
          protocol: TCP
        {{- if .Values.datanode.rdma.enabled }}
        - name: rdma
          containerPort: {{ .Values.datanode.rdma.port }}
          protocol: TCP
        {{- end }}
        volumeMounts:
        - name: storage
          mountPath: /mnt/pillar-data
        {{- if .Values.security.kerberos.enabled }}
        - name: keytabs
          mountPath: /etc/security/keytabs
          readOnly: true
        {{- end }}
        resources:
          {{- toYaml .Values.datanode.resources | nindent 10 }}
        # The data port: the DataNode serves no separate RPC port yet, so a
        # probe on `rpc` fails forever and the kubelet kills the container.
        livenessProbe:
          tcpSocket:
            port: data
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: data
          initialDelaySeconds: 10
          periodSeconds: 5
      {{- if .Values.security.kerberos.enabled }}
      volumes:
      - name: keytabs
        secret:
          secretName: {{ include "pillar.datanodeKeytabSecret" . }}
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.datanode.storage.storageClass }}
      storageClassName: {{ .Values.datanode.storage.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.datanode.storage.size }}
