apiVersion: v1
kind: Service
metadata:
  name: {{ include "pillar.fullname" . }}-namenode
  labels:
    app: {{ include "pillar.name" . }}-namenode
    {{- include "pillar.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.namenode.type }}
  ports:
  - name: rpc
    port: {{ .Values.service.namenode.rpcPort }}
    targetPort: rpc
    protocol: TCP
  - name: http
    port: {{ .Values.service.namenode.httpPort }}
    targetPort: http
    protocol: TCP
  selector:
    app: {{ include "pillar.name" . }}-namenode
