apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "pillar.fullname" . }}-datanode
  labels:
    app: {{ include "pillar.name" . }}-datanode
    {{- include "pillar.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ include "pillar.name" . }}-datanode
  template:
    metadata:
      labels:
        app: {{ include "pillar.name" . }}-datanode
    spec:
      hostNetwork: true  # For direct DataNode access
      containers:
      - name: datanode
        image: "{{ .Values.datanode.image.repository }}:{{ .Values.datanode.image.tag }}"
        imagePullPolicy: {{ .Values.datanode.image.pullPolicy }}
        env:
        # Pod and node information
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        envFrom:
        # Inject common HDFS configuration
        - configMapRef:
            name: {{ include "pillar.fullname" . }}-common-config
        # Inject DataNode-specific configuration
        - configMapRef:
            name: {{ include "pillar.fullname" . }}-datanode-config
        args:
        - --namenode={{ include "pillar.fullname" . }}-namenode:{{ .Values.namenode.rpcPort }}
        - --rpc-addr=0.0.0.0:{{ .Values.datanode.rpcPort }}
        - --data-addr=0.0.0.0:{{ .Values.datanode.dataPort }}
        - --http-addr=0.0.0.0:{{ .Values.datanode.httpPort }}
        - --volume-mount-point=/mnt/pillar-data
        - --block-pool-id={{ .Values.hdfs.blockPoolId }}
        ports:
        - name: rpc
          containerPort: {{ .Values.datanode.rpcPort }}
          protocol: TCP
        - name: data
          containerPort: {{ .Values.datanode.dataPort }}
          protocol: TCP
        - name: http
          containerPort: {{ .Values.datanode.httpPort }}
          protocol: TCP
        volumeMounts:
        - name: storage
          mountPath: /mnt/pillar-data
        resources:
          {{- toYaml .Values.datanode.resources | nindent 10 }}
        livenessProbe:
          tcpSocket:
            port: rpc
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: rpc
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: storage
        persistentVolumeClaim:
          # Pre-create PVCs per node: pillar-datanode-storage-<nodename>
          # Or use a provisioner that auto-creates per-node volumes
          claimName: {{ include "pillar.fullname" . }}-datanode-storage-{{ "{{" }} .NodeName {{ "}}" }}
