{{- if .Values.csiDriver.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pillar.fullname" . }}-csi-controller
  labels:
    {{- include "pillar.labels" . | nindent 4 }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pillar.fullname" . }}-csi-node
  labels:
    {{- include "pillar.labels" . | nindent 4 }}

---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "pillar.fullname" . }}-csi-provisioner
rules:
- apiGroups: [""]
  resources: ["persistentvolumes"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "update"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["list", "watch", "create", "update", "patch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["csinodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "pillar.fullname" . }}-csi-provisioner
subjects:
- kind: ServiceAccount
  name: {{ include "pillar.fullname" . }}-csi-controller
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "pillar.fullname" . }}-csi-provisioner
  apiGroup: rbac.authorization.k8s.io

---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "pillar.fullname" . }}-csi-node
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "pillar.fullname" . }}-csi-node
subjects:
- kind: ServiceAccount
  name: {{ include "pillar.fullname" . }}-csi-node
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "pillar.fullname" . }}-csi-node
  apiGroup: rbac.authorization.k8s.io
{{- end }}
