[workspace]
resolver = "2"
members = [
    "pillar-namenode",
    "pillar-datanode",
    "pillar-proto",
    "pillar-common",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Pillar HDFS Team"]
license = "Apache-2.0"
repository = "https://github.com/ddalton/pillar"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# gRPC and Protobuf
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Data structures
bytes = "1.9"
dashmap = "6.1"
crossbeam = "0.8"

# Cryptography
sha2 = "0.10"

# Kubernetes client (optional, for K8s integrations)
# kube = { version = "0.87", features = ["client", "runtime"] }
# k8s-openapi = { version = "0.20", features = ["latest"] }

# HTTP/REST
warp = "0.3"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.0", features = ["derive"] }

# Utilities
uuid = { version = "1.0", features = ["v4"] }
regex = "1.0"
nix = { version = "0.27", features = ["fs", "user"] }

# Database (for NameNode metadata)
rusqlite = { version = "0.30", features = ["bundled"] }
etcd-client = "0.12"

# RDMA (optional, for high-performance data transfer)
# Using ibverbs: actively maintained (0.9.2, March 2025), no tokio version conflicts
# Provides low-level RDMA verbs interface for production-grade RDMA support
ibverbs = "0.9"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
