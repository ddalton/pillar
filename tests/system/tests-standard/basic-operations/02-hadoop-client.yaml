apiVersion: v1
kind: ConfigMap
metadata:
  name: hadoop-config
data:
  core-site.xml: |
    <?xml version="1.0"?>
    <configuration>
      <property>
        <name>fs.defaultFS</name>
        <value>hdfs://pillar-namenode:9000</value>
      </property>
    </configuration>
---
apiVersion: v1
kind: Pod
metadata:
  name: hadoop-client
  labels:
    app: hadoop-client
spec:
  restartPolicy: Never
  containers:
  - name: client
    image: apache/hadoop:3.3.6
    command:
    - /bin/bash
    - -c
    - |
      set -ex

      # Wait for NameNode to be ready
      echo "Waiting for NameNode to be available..."
      until nc -z pillar-namenode 9000; do
        sleep 2
      done
      sleep 5

      echo "=== Testing Basic HDFS Operations ==="

      # Test 1: Create directory
      echo "Test 1: Creating directory /test"
      hadoop fs -mkdir -p /test

      # Test 2: List root directory
      echo "Test 2: Listing root directory"
      hadoop fs -ls /

      # Test 3: Write a file
      echo "Test 3: Writing test file"
      echo "Hello from Pillar HDFS! Test data: $(date)" > /tmp/test-file.txt
      echo "Line 2: Random data $RANDOM" >> /tmp/test-file.txt
      hadoop fs -put /tmp/test-file.txt /test/

      # Test 4: List directory contents
      echo "Test 4: Listing /test directory"
      hadoop fs -ls /test

      # Test 5: Read the file back
      echo "Test 5: Reading file content"
      hadoop fs -cat /test/test-file.txt

      # Test 6: Get file stats
      echo "Test 6: Getting file stats"
      hadoop fs -stat "%n %b %r" /test/test-file.txt

      # Test 7: Copy file within HDFS
      echo "Test 7: Copying file within HDFS"
      hadoop fs -cp /test/test-file.txt /test/test-file-copy.txt
      hadoop fs -ls /test

      # Test 8: Verify replication
      echo "Test 8: Verifying replication"
      hadoop fsck /test/test-file.txt -files -blocks -locations

      # Create success marker
      echo "ALL_TESTS_PASSED" > /tmp/test-result.txt
      hadoop fs -put /tmp/test-result.txt /test/

      echo "=== All tests completed successfully ==="
    volumeMounts:
    - name: hadoop-config
      mountPath: /opt/hadoop/etc/hadoop
  volumes:
  - name: hadoop-config
    configMap:
      name: hadoop-config
